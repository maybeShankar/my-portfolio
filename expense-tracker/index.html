<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Budget Tracker</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <!-- Header -->
      <header class="app-header">
        <p class="eyebrow">PERSONAL FINANCE</p>

        <h1>Student Budget Tracker</h1>

        <p>Track your income, expenses and spending habits.</p>
      </header>

      <!-- Balance -->
      <section class="balance-card">
        <p>Current Balance</p>

        <h2 id="balance">₹0</h2>
      </section>

      <!-- Income & Expense -->
      <section class="summary">
        <div class="summary-card income">
          <span>Income</span>
          <strong id="income">₹0</strong>
        </div>

        <div class="summary-card expense">
          <span>Expenses</span>
          <strong id="expenses">₹0</strong>
        </div>
      </section>

      <!-- Add Transaction -->
      <section class="transaction-form">
        <h2>Add Transaction</h2>

        <form id="transaction-form">
          <div class="form-group">
            <label for="description"> Description </label>

            <input
              type="text"
              id="description"
              placeholder="e.g. College books"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount"> Amount </label>

              <input
                type="number"
                id="amount"
                placeholder="500"
                min="1"
                required
              />
            </div>

            <div class="form-group">
              <label for="type"> Type </label>

              <select id="type">
                <option value="expense">Expense</option>

                <option value="income">Income</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="category"> Category </label>

            <select id="category">
              <option value="Food">Food</option>

              <option value="Education">Education</option>

              <option value="Travel">Travel</option>

              <option value="Entertainment">Entertainment</option>

              <option value="Shopping">Shopping</option>

              <option value="Other">Other</option>
            </select>
          </div>

          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <!-- Transactions -->
      <section class="transactions">
        <div class="section-heading">
          <h2>Recent Transactions (<span id="transaction-count">0</span>)</h2>

          <button id="clear-all" class="clear-btn" type="button">
            Clear All
          </button>
        </div>

        <div id="transaction-list">
          <p class="empty-message">No transactions yet.</p>
        </div>
      </section>

      <!-- Spending -->
      <section class="spending">
        <h2>Spending Overview</h2>

        <div id="category-list">
          <p class="empty-message">
            Add some expenses to see your spending breakdown.
          </p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
